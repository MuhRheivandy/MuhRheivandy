<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">Muh Rheivandy monochrome cyber console</title>
  <desc id="desc">A black and white terminal panel identifying Muh Rheivandy as a fullstack developer, UI UX designer, and cybersecurity enthusiast.</desc>

  <rect width="960" height="300" rx="12" fill="#050505"/>
  <rect x="1" y="1" width="958" height="298" rx="11" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="2"/>

  <g fill="none" stroke="#ffffff" stroke-opacity="0.1">
    <path d="M0 50H960M0 250H960"/>
    <path d="M640 0V300M800 0V300"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="30" y="32" fill="#8b949e" font-size="13">SYS://OPERATOR_PROFILE</text>
    <text x="818" y="32" fill="#ffffff" font-size="13">[ ONLINE ]</text>

    <text x="44" y="90" fill="#8b949e" font-size="15">IDENTITY VERIFIED</text>
    <text x="44" y="154" fill="#ffffff" font-size="44" font-weight="700" letter-spacing="3">MUH RHEIVANDY</text>
    <text x="44" y="192" fill="#d0d0d0" font-size="17">FULLSTACK / UI·UX / CYBERSECURITY</text>
    <text x="44" y="234" fill="#8b949e" font-size="14">BUILDING  ·  LEARNING  ·  EXPLORING</text>
    <rect x="407" y="220" width="9" height="17" fill="#ffffff">
      <animate attributeName="opacity" values="1;1;0.15;0.15;1" dur="1.8s" repeatCount="indefinite"/>
    </rect>

    <text x="675" y="91" fill="#ffffff" fill-opacity="0.7" font-size="13">01001101  M</text>
    <text x="675" y="119" fill="#ffffff" fill-opacity="0.55" font-size="13">01010101  U</text>
    <text x="675" y="147" fill="#ffffff" fill-opacity="0.4" font-size="13">01001000  H</text>
    <text x="675" y="204" fill="#8b949e" font-size="12">ACCESS: PUBLIC</text>
    <text x="675" y="230" fill="#8b949e" font-size="12">LOCATION: ID</text>
  </g>

  <rect x="0" y="52" width="960" height="1" fill="#ffffff" opacity="0.08">
    <animate attributeName="y" values="52;248;52" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.05;0.22;0.05" dur="12s" repeatCount="indefinite"/>
  </rect>
</svg>
