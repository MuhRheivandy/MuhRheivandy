<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 18" role="img" aria-labelledby="title desc">
  <title id="title">Monochrome terminal divider</title>
  <desc id="desc">A thin gray line with a slowly moving white signal.</desc>
  <path d="M0 9H960" stroke="#8b949e" stroke-opacity="0.38"/>
  <path d="M0 9H180" stroke="#ffffff" stroke-opacity="0.75"/>
  <rect x="0" y="6" width="24" height="6" fill="#ffffff">
    <animate attributeName="x" values="0;936;0" dur="16s" repeatCount="indefinite"/>
  </rect>
</svg>
