<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-labelledby="title desc">
  <title id="title">Binary hands welcome animation</title>
  <desc id="desc">Two open hands built from zeroes and ones move apart to reveal the message Welcome to my GitHub.</desc>

  <defs>
    <g id="left-hand">
      <path d="M0 105L145 119C188 123 218 139 247 166L260 222C229 249 197 261 151 258L0 247Z"/>
      <ellipse cx="245" cy="190" rx="72" ry="61" transform="rotate(8 245 190)"/>
      <path d="M224 144C270 124 326 120 382 127L474 140C491 143 495 158 480 166L383 165C329 164 283 174 245 190Z"/>
      <path d="M251 166C295 158 340 161 382 173L433 188C449 193 449 207 433 212L378 202C333 194 294 197 257 208Z"/>
      <path d="M253 195C290 198 324 209 355 226L389 245C402 254 397 268 381 268L341 249C309 234 280 229 248 228Z"/>
      <path d="M225 215C252 229 274 250 293 274L316 304C324 317 315 328 301 322L270 291C248 270 226 256 198 247Z"/>
    </g>
    <pattern id="binary-pattern" width="88" height="28" patternUnits="userSpaceOnUse">
      <rect width="88" height="28" fill="#ffffff" fill-opacity="0.015"/>
      <text x="0" y="11" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="3">0101101</text>
      <text x="8" y="25" fill="#ffffff" fill-opacity="0.64" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="3">1010010</text>
    </pattern>
  </defs>

  <rect width="1000" height="380" rx="14" fill="#050505"/>
  <rect x="1" y="1" width="998" height="378" rx="13" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2"/>

  <g fill="none" stroke="#ffffff" stroke-opacity="0.1">
    <path d="M0 54H1000M0 326H1000"/>
    <path d="M80 0V380M920 0V380"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="28" y="34" fill="#8b949e" font-size="12">SYS://BINARY_HANDSHAKE</text>
    <text x="879" y="34" fill="#ffffff" font-size="12">[ 01 ]</text>
  </g>

  <g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="22 0;22 0;-148 0" keyTimes="0;0.18;1" dur="3.2s" fill="freeze"/>
      <use href="#left-hand" fill="url(#binary-pattern)" stroke="#ffffff" stroke-opacity="0.42" stroke-width="1.2"/>
    </g>

    <g>
      <animateTransform attributeName="transform" type="translate" values="-22 0;-22 0;148 0" keyTimes="0;0.18;1" dur="3.2s" fill="freeze"/>
      <use href="#left-hand" transform="translate(1000 0) scale(-1 1)" fill="url(#binary-pattern)" stroke="#ffffff" stroke-opacity="0.42" stroke-width="1.2"/>
    </g>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" opacity="1">
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.48;1" dur="3.2s" fill="freeze"/>
    <rect x="338" y="112" width="324" height="156" rx="4" fill="#050505" stroke="#ffffff" stroke-opacity="0.34"/>
    <path d="M354 132H646M354 245H646" stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="500" y="169" fill="#8b949e" font-size="13" letter-spacing="3">HELLO, WORLD</text>
    <text x="500" y="207" fill="#ffffff" font-size="23" font-weight="700">WELCOME TO MY GITHUB</text>
    <text x="500" y="233" fill="#8b949e" font-size="12">MUH RHEIVANDY _</text>
  </g>
</svg>
